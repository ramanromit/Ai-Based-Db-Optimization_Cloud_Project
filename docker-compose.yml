version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: caqi-postgres
    environment:
      POSTGRES_DB: caqi_db
      POSTGRES_USER: caqi_admin
      POSTGRES_PASSWORD: caqi_secret
    ports:
      - "5432:5432"
    volumes:
      - caqi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caqi_admin -d caqi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caqi-redis
    ports:
      - "6379:6379"
    volumes:
      - caqi_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  caqi_pgdata:
  caqi_redisdata:
