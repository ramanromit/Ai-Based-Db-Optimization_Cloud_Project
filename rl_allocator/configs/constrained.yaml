# CAQI Constrained RL Configuration (Main Agent)
algorithm: PPO
policy: MlpPolicy
learning_rate: 0.0003
n_steps: 128
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01

# Environment & Constraint Settings
use_constraint: true
initial_lambda: 2.0
lambda_lr: 0.05
auth_sla_budget_ms: 10.0
total_timesteps: 15000
step_query_count: 50
spike_probability: 0.20

